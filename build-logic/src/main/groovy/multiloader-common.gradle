plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // JourneyMap's API, for the Waypoints tab's bridge into JourneyMap's list. Exclusive, so no
    // other repository is asked for it and this one is asked for nothing else.
    exclusiveContent {
        forRepository {
            maven {
                name = 'JourneyMap'
                url = uri('https://jm.gserv.me/repository/maven-public/')
            }
        }
        filter {
            includeGroup('info.journeymap')
        }
    }
}

dependencies {
    // Compile-time only. Lune ships no copy: the one class that implements the API,
    // com.etka.lune.waypoint.external.LuneJourneyMapPlugin, is loaded by JourneyMap and by nothing
    // else, so a game without JourneyMap never resolves it. Applied here rather than in :common
    // alone because every loader module compiles common's sources a second time.
    compileOnly("info.journeymap:journeymap-api-common:${journeymap_api_version}") {
        transitive = false
        // JourneyMap builds with the same multiloader conventions, so its artifact carries the
        // loader attribute too, marked 'common'. A loader module asks its whole classpath for its
        // own loader and would find no matching variant; asking for 'common' on this dependency
        // alone is the same trick multiloader-loader.gradle uses to consume :common itself.
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// This is a mod, not a published API library - don't let strict javadoc linting (e.g. cross-package
// {@link} references) fail the build.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def luneRelease = providers.gradleProperty('luneRelease')
            .map { it.toBoolean() }
            .orElse(false)

    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'forge_version'                : forge_version,
            'forge_loader_version_range'   : forge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    // The same properties the loader metadata is built from, so the version Lune shows on the
    // About tab cannot drift from the version in the jar's own name.
    filesMatching('lune-build.properties') {
        expand expandProps + [luneRelease: luneRelease.get()]
    }

    inputs.properties(expandProps)
    inputs.property('luneRelease', luneRelease)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        if (System.getenv('local_maven_url')) {
            maven { url System.getenv('local_maven_url') }
        }
    }
}
