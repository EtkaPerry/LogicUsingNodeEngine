# ============================================================================
#  Lune - toolchain for Minecraft 26.2. Chosen with -Pmc=26.2 (see gradle.properties).
#  One file per Minecraft version; settings.gradle turns its lines into project properties.
#  Pure ASCII only: Gradle reads .properties as ISO-8859-1.
# ============================================================================
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)

## Vanilla MC the common module compiles against (NeoForm).
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# Fabric API - https://fabricmc.net/develop/
fabric_version=0.160.0+26.2

# NeoForge - https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.2.0.88

# Forge - https://files.minecraftforge.net/ (published as 26.2-65.1.3; see 26.1.2.properties)
forge_version=65.1.3
forge_loader_version_range=[65,)

# Which folder under common/src/compat holds the shims for this target (see common/build.gradle).
compat_variant=26.2
