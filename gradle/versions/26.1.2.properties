# ============================================================================
#  Lune - toolchain for Minecraft 26.1.2. Chosen with -Pmc=26.1.2 (see gradle.properties).
#  One file per Minecraft version; settings.gradle turns its lines into project properties.
#  Pure ASCII only: Gradle reads .properties as ISO-8859-1.
# ============================================================================
minecraft_version=26.1.2
minecraft_version_range=[26.1.2, 26.2)

## Vanilla MC the common module compiles against (NeoForm).
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric API - https://fabricmc.net/develop/
fabric_version=0.155.2+26.1.2

# NeoForge - https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.1.2.78

# Forge - https://files.minecraftforge.net/
# Published as <minecraft_version>-<forge_version>, i.e. 26.1.2-64.1.2. The loader range is the spec
# version (the leading 64), which is what mods.toml loaderVersion wants. Leave both empty while Forge
# has no build for a Minecraft version: settings.gradle then leaves the :forge module out.
forge_version=64.1.2
forge_loader_version_range=[64,)

# Which folder under common/src/compat holds the shims for this target (see common/build.gradle).
compat_variant=26.1.2
