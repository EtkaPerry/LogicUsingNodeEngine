# ============================================================================
#  Lune - toolchain for Minecraft 26.3. Chosen with -Pmc=26.3 (see gradle.properties).
#  One file per Minecraft version; settings.gradle turns its lines into project properties.
#  Pure ASCII only: Gradle reads .properties as ISO-8859-1.
# ============================================================================
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)

## Vanilla MC the common module compiles against (NeoForm).
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric API - https://fabricmc.net/develop/
fabric_version=0.160.7+26.3

# NeoForge - https://projects.neoforged.net/neoforged/neoforge
# Still a beta at the time of writing (26.3 shipped 2026-09-15); move to the first stable build.
neoforge_version=26.3.0.4-beta

# Forge - https://files.minecraftforge.net/
# No Forge build for 26.3 yet. Empty means the :forge module is left out of this target.
forge_version=
forge_loader_version_range=

# Which folder under common/src/compat holds the shims for this target (see common/build.gradle).
compat_variant=26.3
