# ============================================================================
#  Lune - multiloader build properties.
#  The Minecraft target is the mc line below (override with -Pmc=<version>), and everything that
#  depends on it lives in gradle/versions/<mc>.properties. Every property referenced from
#  build-logic/multiloader-common.gradle's expandProps map MUST be declared in one of the two.
# ============================================================================

# Project
version=0.6.6.3
group=com.etka.lune
java_version=25

# Minecraft target: the name of a file under gradle/versions. Pass -Pmc=26.2 (or 26.3) to build for
# another one without touching this file; the release build asks which ones to build.
mc=26.1.2

# Common
mod_name=Lune
mod_author=Etka
mod_id=lune
# SPDX has no id for a personal-use license, so this is a LicenseRef, which is what SPDX and the
# mod portals expect for custom terms. The human-readable version is LICENSE, bundled in the jar.
license=LicenseRef-Lune-Personal-Use
# Keep this file pure ASCII: Gradle reads .properties as ISO-8859-1, so non-ASCII here
# (an em dash, say) arrives mangled in the generated mods.toml / fabric.mod.json.
credits=Etka
description=Lune (Logic Using Node Engine) is a client-side automation bot. Queue tasks like mine, kill, fish and goto, and let the pathfinder do the walking.

# Loader versions that do not follow the Minecraft version. The Minecraft-specific ones -
# minecraft_version, minecraft_version_range, neo_form_version, fabric_version, neoforge_version,
# forge_version and forge_loader_version_range - are in gradle/versions/<mc>.properties.
# Fabric loader - https://fabricmc.net/develop/
fabric_loader_version=0.19.3
# NeoForge's javafml language loader
neoforge_loader_version_range=[4,)

# Tooling
junit_version=5.11.3

# JourneyMap API, compile-time only, for the Waypoints tab's bridge into JourneyMap's list
# (com.etka.lune.waypoint.external). Its maven publishes snapshots only, so this pins one build
# of the 26.1 snapshot by its timestamp: the same jar every time, and nothing to re-check online.
# https://jm.gserv.me/repository/maven-public/info/journeymap/journeymap-api-common/
journeymap_api_version=2.0.0-26.1-20260529.024148-13

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle only. Sends :forge's classes and resources to one directory instead of
# build/classes/java/main plus build/resources/main. Forge's dev launcher turns each output
# directory into its own JPMS module, and two directories holding one package fails module
# resolution ("Modules main and lune export package com.etka.lune.platform"). The Forge MDK sets
# this for the same reason; FG warns when it is off. Loom and moddev ignore it.
net.minecraftforge.gradle.merge-source-sets=true
