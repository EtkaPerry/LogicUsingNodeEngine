# ============================================================================
#  Lune — multiloader build properties (Minecraft 26.1.2)
#  Every property referenced from build-logic/multiloader-common.gradle's
#  expandProps map MUST be declared here.
# ============================================================================

# Project
version=0.5.2.3
group=com.etka.lune
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Lune
mod_author=Etka
mod_id=lune
# SPDX has no id for a personal-use license, so this is a LicenseRef, which is what SPDX and the
# mod portals expect for custom terms. The human-readable version is LICENSE, bundled in the jar.
license=LicenseRef-Lune-Personal-Use
# Keep this file pure ASCII: Gradle reads .properties as ISO-8859-1, so non-ASCII here
# (an em dash, say) arrives mangled in the generated mods.toml / fabric.mod.json.
credits=Etka
description=Lune (Logic Using Node Engine) is a client-side automation bot. Queue tasks like mine, kill, fish and goto, and let the pathfinder do the walking.
minecraft_version_range=[26.1.2, 26.2)
## Vanilla MC the 'common' project compiles against (NeoForm).
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric — https://fabricmc.net/develop/
fabric_version=0.155.2+26.1.2
fabric_loader_version=0.19.3

# NeoForge — https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.1.2.78
neoforge_loader_version_range=[4,)

# Forge — https://files.minecraftforge.net/
# The build is published as <minecraft_version>-<forge_version>, i.e. 26.1.2-64.1.2. The loader
# range is the spec version (the leading 64), which is what mods.toml's loaderVersion wants.
forge_version=64.1.2
forge_loader_version_range=[64,)

# Tooling
junit_version=5.11.3

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle only. Sends :forge's classes and resources to one directory instead of
# build/classes/java/main plus build/resources/main. Forge's dev launcher turns each output
# directory into its own JPMS module, and two directories holding one package fails module
# resolution ("Modules main and lune export package com.etka.lune.platform"). The Forge MDK sets
# this for the same reason; FG warns when it is off. Loom and moddev ignore it.
net.minecraftforge.gradle.merge-source-sets=true
