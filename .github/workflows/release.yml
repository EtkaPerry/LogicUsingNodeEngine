name: Release

on:
  push:
    branches: [main]
    paths:
      - gradle.properties
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every target, check the CurseForge token, publish nothing
        type: boolean
        required: false
        default: true
      force:
        description: Publish even when a release for this version already exists
        type: boolean
        required: false
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # CurseForge channel for every version this publishes: release, beta or alpha.
  #
  # Lune is published on CurseForge. Modrinth refused the project outright
  # under its AI-content rule - "not suitable to be published publicly", do
  # not resubmit - so nothing in this workflow posts there, and the license
  # names CurseForge as the modpack platform instead.
  RELEASE_CHANNEL: alpha
  # The publish job has no checkout, so gh has no remote to infer this from.
  GH_REPO: ${{ github.repository }}
  # The numeric CurseForge project id - it is in the project's curseforge.com
  # URL, and the project has to exist before the first real publish. The
  # console API key (console.curseforge.com) goes in the CURSEFORGE_TOKEN
  # secret; the one key uploads files and reads the project's file list.
  CURSEFORGE_PROJECT: "0"
  FABRIC_API_SLUG: fabric-api

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      mod_id: ${{ steps.decide.outputs.mod_id }}
      channel: ${{ steps.decide.outputs.channel }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          prop() { sed -n "s/^$1=//p" gradle.properties | head -n 1 | tr -d '\r'; }

          version=$(prop version)
          mod_id=$(prop mod_id)
          if [ -z "$version" ] || [ -z "$mod_id" ]; then
            echo "::error::Could not read version / mod_id from gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mod_id=$mod_id" >> "$GITHUB_OUTPUT"

          case "$RELEASE_CHANNEL" in
            release|beta|alpha) ;;
            *) echo "::error::RELEASE_CHANNEL is '$RELEASE_CHANNEL'; CurseForge takes release, beta or alpha."; exit 1 ;;
          esac
          echo "channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Version $version, CurseForge channel $RELEASE_CHANNEL."

          # Compared against the commit the branch was on before this push, not
          # HEAD^: a push can carry several commits and the bump is not always
          # the last of them.
          zero=0000000000000000000000000000000000000000
          was=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run."
          else
            if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ]; then
              was=$(gh api "repos/$GH_REPO/contents/gradle.properties?ref=$BEFORE" \
                      --jq '.content' 2>/dev/null | base64 -d 2>/dev/null |
                    sed -n 's/^version=//p' | head -n 1 | tr -d '\r') || was=""
            fi
            if [ -z "$was" ]; then
              echo "Nothing to compare $version against; leaving it to the release guard."
            elif [ "$was" = "$version" ]; then
              echo "The version is still $version. Nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "Version moved: $was -> $version."
            fi
          fi

          if gh release view "v$version" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::Release v$version already exists; force was requested, continuing."
            else
              echo "Release v$version already exists. Nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

      # Always runs: a strategy.matrix reading an empty output is a workflow
      # error rather than a skipped job.
      - name: Find the Minecraft targets
        id: targets
        run: |
          set -euo pipefail
          targets=$(node -e '
            const fs = require("fs");
            const dir = "gradle/versions";
            const read = (name) => fs.readFileSync(`${dir}/${name}`, "latin1");
            const value = (text, key) => {
              const m = text.match(new RegExp(`^${key}=(.*)$`, "m"));
              return m ? m[1].trim() : "";
            };
            // Padded so 26.1.2 sorts before 26.2 rather than after it.
            const key = (s) => s.split(/[^0-9]+/).filter(Boolean)
                                .map((n) => n.padStart(5, "0")).join(".");
            const rows = fs.readdirSync(dir)
              .filter((n) => n.endsWith(".properties"))
              .map((name) => {
                const text = read(name);
                const mc = name.slice(0, -".properties".length);
                const minecraft = value(text, "minecraft_version") || mc;
                // An empty forge_version means Forge has no build for this
                // version yet, and settings.gradle leaves :forge out of it.
                const loaders = ["neoforge", "fabric"];
                if (value(text, "forge_version")) loaders.push("forge");
                return { mc, minecraft, loaders };
              })
              .sort((a, b) => key(a.mc).localeCompare(key(b.mc)));
            if (rows.length === 0) throw new Error("No .properties files under gradle/versions");
            process.stdout.write(JSON.stringify(rows));
          ')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets" | node -e '
            const rows = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const r of rows) console.log(`  ${r.mc}  ${r.loaders.join(" + ")}`);
          '

      # The notes come from CHANGELOG.md in the commit being run, never from
      # the release page, so a re-run publishes the same notes as the first
      # run. A version's notes are everything under its "## <version>"
      # heading, up to the next heading of that level.
      - name: Read the release notes
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          RELEASE: ${{ steps.decide.outputs.release }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/changelog"
          file="$RUNNER_TEMP/changelog/changelog.json"

          node - > "$file" <<'READ_CHANGELOG'
          const fs = require("fs");
          const repo = process.env.GH_REPO;
          const text = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "";
          const notes = {};
          let version = null;
          let lines = [];
          const close = () => {
            const body = lines.join("\n").trim();
            if (version && body) {
              notes[version] = {
                // The GitHub release body.
                notes: body,
                // Each CurseForge file's changelog: the same notes, and the way to the jars.
                curseforge: `${body}\n\n---\nAll downloads and the full notes: https://github.com/${repo}/releases/tag/v${version}`,
              };
            }
          };
          for (const line of text.split(/\r?\n/)) {
            const heading = line.match(/^(#{1,2})\s+(.*)$/);
            if (!heading) {
              if (version) lines.push(line);
              continue;
            }
            close();
            // "## 0.9.1.8", and "## v0.9.1.8" or "## [0.9.1.8] - date" as well.
            const found = heading[1] === "##" && heading[2].match(/^\[?v?(\d[^\s\]]*)/);
            version = found ? found[1] : null;
            lines = [];
          }
          close();
          process.stdout.write(JSON.stringify(notes, null, 2) + "\n");
          READ_CHANGELOG

          echo "CHANGELOG.md has notes for: $(jq -r 'keys_unsorted | if length == 0 then "nothing" else join(", ") end' "$file")"
          if [ "$RELEASE" = "true" ] && ! jq -e --arg v "$VERSION" 'has($v)' "$file" > /dev/null; then
            echo "::error::CHANGELOG.md has no notes for $VERSION, so its release pages would have none. Nothing was built or published. Add a '## $VERSION' section, push it, then run this workflow from the Actions tab with dry run unticked."
            exit 1
          fi

      # Through an artifact rather than a job output: outputs travel in
      # environment variables, which a changelog outgrows.
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog/changelog.json
          if-no-files-found: error
          retention-days: 14

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      # JAVA_HOME is the last entry, so Gradle runs on 21 and compiles with 25.
      # ForgeGradle 7 is the reason it is not the other way round.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Point Gradle at both JDKs
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_21_X64" \
            >> ~/.gradle/gradle.properties

      - name: Cache Gradle and the decompiled Minecraft
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/neoformruntime
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/minecraft
            ~/.gradle/caches/minecraftforge
            ~/.gradle/wrapper/dists
            ~/.gradle/jdks
          key: gradle-mc${{ matrix.target.mc }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'gradle/versions/*.properties', '**/*.gradle', 'build-logic/**') }}
          restore-keys: |
            gradle-mc${{ matrix.target.mc }}-

      - name: Build Minecraft ${{ matrix.target.mc }}
        env:
          MC: ${{ matrix.target.mc }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew # committed non-executable
          ./gradlew --no-daemon --stacktrace build -PluneRelease=true "-Pmc=$MC"

      - name: Check the release marker and the bundled profile
        env:
          MC_VERSION: ${{ matrix.target.minecraft }}
        run: |
          set -euo pipefail
          marker=common/build/resources/main/lune-build.properties
          profile=common/build/resources/main/lune-learning.json

          [ -f "$marker" ] || { echo "::error::Release marker is missing: $marker"; exit 1; }
          grep -qx 'lune.release=true' "$marker" \
            || { echo "::error::Release marker is not set to true: $marker"; exit 1; }
          grep -qx "lune.minecraft=$MC_VERSION" "$marker" \
            || { echo "::error::Release marker was not built for Minecraft $MC_VERSION: $(cat "$marker")"; exit 1; }

          [ -f "$profile" ] || { echo "::error::Bundled learning profile is missing: $profile"; exit 1; }
          if grep -qE '"(approved|disapproved|automatic|totalAutomatic)[^"]*"[[:space:]]*:' "$profile"; then
            echo "::error::Bundled release learning profile contains developer-only approval metadata"
            exit 1
          fi
          echo "Release marker and bundled learning profile verified."

      - name: Collect the loader jars
        id: collect
        env:
          MOD_ID: ${{ needs.plan.outputs.mod_id }}
          VERSION: ${{ needs.plan.outputs.version }}
          MC: ${{ matrix.target.mc }}
          MC_VERSION: ${{ matrix.target.minecraft }}
          LOADERS: ${{ join(matrix.target.loaders, ' ') }}
        run: |
          set -euo pipefail
          mkdir -p staging

          missing=""
          rows="[]"
          for loader in $LOADERS; do
            file="$MOD_ID-$loader-$MC_VERSION-$VERSION.jar"
            path="$loader/build/libs/$file"
            if [ -f "$path" ]; then
              cp "$path" "staging/$file"
              rows=$(printf '%s' "$rows" | jq -c \
                --arg mc "$MC_VERSION" --arg loader "$loader" --arg file "$file" \
                '. + [{mc: $mc, loader: $loader, file: $file}]')
              echo "  $file  ($(du -h "$path" | cut -f1))"
            else
              missing="$missing $loader"
              echo "::error::No jar at $path"
              ls -la "$loader/build/libs" 2>/dev/null || echo "  (no build/libs at all)"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing jars for:$missing"
            exit 1
          fi

          printf '%s' "$rows" > "staging/manifest-$MC.json"

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.target.mc }}
          path: staging/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      VERSION: ${{ needs.plan.outputs.version }}
      MOD_ID: ${{ needs.plan.outputs.mod_id }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: jars-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: changelog

      - name: List what was built
        id: inventory
        run: |
          set -euo pipefail
          manifest=$(jq -s -c 'add | sort_by(.mc, .loader)' jars/manifest-*.json)
          count=$(printf '%s' "$manifest" | jq 'length')
          files=$(ls jars/*.jar | wc -l)
          if [ "$count" -ne "$files" ]; then
            echo "::error::$count jars in the manifests but $files on disk."
            exit 1
          fi
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          {
            echo "## Lune $VERSION ($CHANNEL)"
            echo
            echo "| Minecraft | Loader | File |"
            echo "|---|---|---|"
            printf '%s' "$manifest" | jq -r '.[] | "| \(.mc) | \(.loader) | \(.file) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      # Before anything is uploaded, so a bad token fails while nothing has
      # been published.
      - name: Check the CurseForge project and token
        id: curseforge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CURSEFORGE_TOKEN:-}" ]; then
            echo "::error::Secret CURSEFORGE_TOKEN is not set. It needs a CurseForge API key from console.curseforge.com - the one key uploads files and reads the project's file list."
            exit 1
          fi
          body=$(curl -sS --fail-with-body \
            -H "x-api-key: $CURSEFORGE_TOKEN" -H "Accept: application/json" \
            "https://api.curseforge.com/v1/mods/$CURSEFORGE_PROJECT") || {
              echo "::error::CurseForge rejected the lookup of project '$CURSEFORGE_PROJECT': $body"
              exit 1
            }
          id=$(printf '%s' "$body" | jq -r '.data.id')
          echo "project_id=$id" >> "$GITHUB_OUTPUT"
          echo "CurseForge project $(printf '%s' "$body" | jq -r '.data.name') ($id)."

      - name: GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION exists; uploading the jars into it."
            gh release upload "v$VERSION" jars/*.jar --clobber
          else
            jq -r --arg v "$VERSION" '.[$v].notes' changelog/changelog.json > "$RUNNER_TEMP/notes.md"
            gh release create "v$VERSION" jars/*.jar \
              --title "Lune $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi

      - name: Upload to CurseForge
        if: env.DRY_RUN != 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PROJECT_ID: ${{ steps.curseforge.outputs.project_id }}
          MANIFEST: ${{ steps.inventory.outputs.manifest }}
        run: |
          set -euo pipefail

          changelog=$(jq -r --arg v "$VERSION" '.[$v].curseforge' changelog/changelog.json)

          # Every id CurseForge asks for - the Minecraft version, the loader
          # and the environment tags - is an entry in its game-versions list,
          # matched by name: "1.21.1", "NeoForge", "Client".
          versions=$(curl -sS --fail-with-body \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            "https://minecraft.curseforge.com/api/game/versions")
          version_id() {
            id=$(printf '%s' "$versions" | jq -r --arg n "$1" \
              '[.[] | select(.name == $n) | .id][0] // empty')
            if [ -z "$id" ]; then
              echo "::error::CurseForge has no game version named '$1'." >&2
              return 1
            fi
            printf '%s' "$id"
          }

          # Keyed on the jar name rather than the version number: every version
          # here carries the same number. Skipping what is already up finishes a
          # partial upload. The files list pages fifty at a time.
          existing=""
          index=0
          while :; do
            page=$(curl -sS --fail-with-body \
              -H "x-api-key: $CURSEFORGE_TOKEN" -H "Accept: application/json" \
              "https://api.curseforge.com/v1/mods/$PROJECT_ID/files?index=$index&pageSize=50")
            existing="$existing
$(printf '%s' "$page" | jq -r '.data[].fileName')"
            index=$((index + 50))
            [ "$index" -ge "$(printf '%s' "$page" | jq '.pagination.totalCount')" ] && break
          done

          uploaded=0
          skipped=0
          while read -r row; do
            mc=$(printf '%s' "$row" | jq -r '.mc')
            loader=$(printf '%s' "$row" | jq -r '.loader')
            file=$(printf '%s' "$row" | jq -r '.file')

            if printf '%s\n' "$existing" | grep -qxF "$file"; then
              echo "  skip  $file (already on CurseForge)"
              skipped=$((skipped + 1))
              continue
            fi

            case "$loader" in
              fabric)   lname=Fabric ;;
              neoforge) lname=NeoForge ;;
              forge)    lname=Forge ;;
              *) echo "::error::No CurseForge loader tag for '$loader'"; exit 1 ;;
            esac
            # Both environment tags: Lune runs on client and server and is
            # required on neither.
            ids=$(jq -n -c \
              --argjson mc "$(version_id "$mc")" \
              --argjson loader "$(version_id "$lname")" \
              --argjson client "$(version_id Client)" \
              --argjson server "$(version_id Server)" \
              '[$mc, $loader, $client, $server]')

            relations='{"projects":[]}'
            if [ "$loader" = "fabric" ]; then
              relations=$(jq -n -c --arg s "$FABRIC_API_SLUG" \
                '{projects: [{slug: $s, type: "requiredDependency"}]}')
            fi

            data=$(jq -n -c \
              --arg name "Lune $VERSION for Minecraft $mc ($loader)" \
              --arg changelog "$changelog" \
              --arg loader "$lname" \
              --arg channel "$CHANNEL" \
              --argjson ids "$ids" \
              --argjson rel "$relations" \
              '{
                 changelog: $changelog, changelogType: "markdown",
                 displayName: $name, gameVersions: $ids, releaseType: $channel,
                 modLoaders: [$loader], relations: $rel
               }')

            # Through a file, not -F "metadata=$data": curl reads a ';' in an
            # inline value as the start of a content-type and truncates the
            # field there.
            printf '%s' "$data" > /tmp/curseforge-upload.json
            response=$(curl -sS --fail-with-body -X POST \
              -H "X-Api-Token: $CURSEFORGE_TOKEN" \
              -F "metadata=</tmp/curseforge-upload.json;type=application/json" \
              -F "file=@jars/$file;type=application/java-archive" \
              "https://minecraft.curseforge.com/api/projects/$PROJECT_ID/upload-file") || {
                echo "::error::CurseForge rejected $file: $response"
                exit 1
              }
            echo "  up    $file -> file $(printf '%s' "$response" | jq -r '.id')"
            uploaded=$((uploaded + 1))
          done < <(printf '%s' "$MANIFEST" | jq -c '.[]')

          echo "CurseForge: $uploaded uploaded, $skipped already there."
          echo "- CurseForge: $uploaded uploaded, $skipped already there" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run: every target built, the CurseForge project and token check out, nothing was published."
          echo "Re-run from the Actions tab with the dry_run box cleared to publish v$VERSION."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dry run** - nothing was published." >> "$GITHUB_STEP_SUMMARY"

  skipped:
    needs: plan
    if: needs.plan.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "No release: the version did not move, or v${{ needs.plan.outputs.version }} is already out."
          echo "No release for this push (version unchanged, or already published)." >> "$GITHUB_STEP_SUMMARY"
